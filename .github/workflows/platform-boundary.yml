name: Platform boundary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-boundary:
    name: platform-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require private repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPO_PRIVATE" = "true"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prove rejection and accepted cases
        run: python -B -m unittest discover -s .github/checks/guard -p 'test_*.py' -v
      - name: Check current committed bytes
        run: python -B tools/check_platform_boundary.py --scope commit
      - name: Check publication tree
        run: python -B tools/check_platform_boundary.py --scope release
  rdkit-scientific:
    name: rdkit-scientific-offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require private repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPO_PRIVATE" = "true"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned scientific wheels
        run: >-
          python -m pip install --only-binary=:all: --retries 0 --timeout 20
          -r skills/organic-smiles-rdkit/runtime/requirements.txt
      - name: Test RDKit boundaries and offline provider failures
        env:
          MPLBACKEND: Agg
        run: python -B -m unittest discover -s .github/checks/rdkit -p 'test_*.py' -v
      - name: Test Python commands, parameters and result archives
        env:
          MPLBACKEND: Agg
        run: python -B -m unittest discover -s .github/checks/python -p 'test_*.py' -v
